<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Transparent canvas. ZX Spectrum 48K-inspired wedge + rainbow. -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d3d"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="18" y="48" width="220" height="168" rx="18" ry="18" fill="url(#case)"/>
  <rect x="28" y="58" width="200" height="92" rx="8" ry="8" fill="url(#face)"/>
  <!-- CRT well -->
  <rect x="40" y="68" width="176" height="72" rx="4" ry="4" fill="#0a0a12"/>
  <!-- rainbow load bars -->
  <g transform="translate(52,80)">
    <rect x="0" y="0" width="152" height="8" fill="#0000d7"/>
    <rect x="0" y="10" width="152" height="8" fill="#d70000"/>
    <rect x="0" y="20" width="152" height="8" fill="#d700d7"/>
    <rect x="0" y="30" width="152" height="8" fill="#00d700"/>
    <rect x="0" y="40" width="152" height="8" fill="#00d7d7"/>
    <rect x="0" y="50" width="88" height="8" fill="#d7d700"/>
  </g>
  <text x="148" y="136" font-family="DejaVu Sans Mono, Nimbus Mono L, monospace"
        font-size="22" font-weight="700" fill="#f4f4f4">ZX</text>
  <!-- rainbow stripe on case -->
  <g transform="translate(28,154)">
    <rect x="0" y="0" width="29" height="6" fill="#0000d7"/>
    <rect x="29" y="0" width="29" height="6" fill="#d70000"/>
    <rect x="58" y="0" width="29" height="6" fill="#d700d7"/>
    <rect x="87" y="0" width="29" height="6" fill="#00d700"/>
    <rect x="116" y="0" width="29" height="6" fill="#00d7d7"/>
    <rect x="145" y="0" width="29" height="6" fill="#d7d700"/>
    <rect x="174" y="0" width="26" height="6" fill="#d7d7d7"/>
