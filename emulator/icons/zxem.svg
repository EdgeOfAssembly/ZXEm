      <rect x="0" y="0" width="14" height="8" rx="1"/><rect x="18" y="0" width="14" height="8" rx="1"/><rect x="36" y="0" width="14" height="8" rx="1"/><rect x="54" y="0" width="14" height="8" rx="1"/><rect x="72" y="0" width="14" height="8" rx="1"/><rect x="90" y="0" width="14" height="8" rx="1"/><rect x="108" y="0" width="14" height="8" rx="1"/><rect x="126" y="0" width="14" height="8" rx="1"/><rect x="144" y="0" width="14" height="8" rx="1"/><rect x="162" y="0" width="14" height="8" rx="1"/>
      <rect x="0" y="12" width="14" height="8" rx="1"/><rect x="18" y="12" width="14" height="8" rx="1"/><rect x="36" y="12" width="14" height="8" rx="1"/><rect x="54" y="12" width="14" height="8" rx="1"/><rect x="72" y="12" width="14" height="8" rx="1"/><rect x="90" y="12" width="14" height="8" rx="1"/><rect x="108" y="12" width="14" height="8" rx="1"/><rect x="126" y="12" width="14" height="8" rx="1"/><rect x="144" y="12" width="14" height="8" rx="1"/><rect x="162" y="12" width="14" height="8" rx="1"/>
